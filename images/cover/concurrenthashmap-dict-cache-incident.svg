<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img" aria-labelledby="title desc">
  <title id="title">ConcurrentHashMap Cache Incident Cover</title>
  <desc id="desc">Production incident caused by unbounded dictionary cache and mitigation strategies</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="800" height="550" fill="url(#bg)"/>
  <circle cx="700" cy="80" r="105" fill="#a78bfa" opacity="0.16"/>
  <circle cx="95" cy="400" r="128" fill="#22d3ee" opacity="0.12"/>

  <rect x="42" y="34" width="260" height="36" rx="10" fill="url(#chip)"/>
  <text x="172" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#082f49">
    BACKEND INCIDENT REVIEW
  </text>

  <text x="42" y="128" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#f8fafc">
    ConcurrentHashMap Cache
  </text>
  <text x="42" y="168" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#dbeafe">
    Production Problem &amp; Fix
  </text>

  <rect x="42" y="220" width="716" height="170" rx="14" fill="#081225" opacity="0.62" stroke="#93c5fd" stroke-opacity="0.35"/>
  <text x="68" y="260" font-family="Consolas, Menlo, monospace" font-size="18" fill="#bfdbfe">
    private final Map&lt;String, String&gt; dictListCache
  </text>
  <text x="68" y="292" font-family="Consolas, Menlo, monospace" font-size="18" fill="#bfdbfe">
    = new ConcurrentHashMap&lt;&gt;();
  </text>
  <text x="68" y="332" font-family="Arial, sans-serif" font-size="19" fill="#e2e8f0">
    Unbounded Growth | Full GC | Timeout | Recovery
  </text>
</svg>
