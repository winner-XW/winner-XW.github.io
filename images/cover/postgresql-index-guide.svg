<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img" aria-labelledby="title desc">
  <title id="title">PostgreSQL Index Guide Cover</title>
  <desc id="desc">Introduction examples and comparison of PostgreSQL indexes</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="800" height="550" fill="url(#bg)"/>
  <circle cx="710" cy="70" r="95" fill="#38bdf8" opacity="0.14"/>
  <circle cx="90" cy="360" r="120" fill="#a78bfa" opacity="0.14"/>

  <rect x="44" y="36" width="210" height="34" rx="10" fill="url(#chip)"/>
  <text x="149" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#082f49">
    DATABASE THEORY
  </text>

  <text x="44" y="130" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#f8fafc">
    PostgreSQL Index
  </text>
  <text x="44" y="172" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#dbeafe">
    Intro, Examples, Comparison
  </text>

  <rect x="44" y="220" width="712" height="146" rx="14" fill="#081225" opacity="0.6" stroke="#93c5fd" stroke-opacity="0.35"/>

  <text x="72" y="260" font-family="Consolas, Menlo, monospace" font-size="18" fill="#bfdbfe">
    CREATE INDEX idx_orders_user_created
  </text>
  <text x="72" y="288" font-family="Consolas, Menlo, monospace" font-size="18" fill="#bfdbfe">
    ON orders(user_id, created_at DESC);
  </text>
  <text x="72" y="328" font-family="Arial, sans-serif" font-size="18" fill="#e2e8f0">
    B-Tree | GIN | GiST | BRIN | Hash
  </text>
</svg>
