<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img" aria-labelledby="title desc">
  <title id="title">Docker Common Commands Guide Cover</title>
  <desc id="desc">A modern cover for Docker command collection article.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1b33"/>
      <stop offset="100%" stop-color="#0f4b8b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#111b2f" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="550" fill="url(#bg)"/>
  <circle cx="700" cy="80" r="130" fill="#67e8f9" fill-opacity="0.11"/>
  <circle cx="120" cy="500" r="170" fill="#22d3ee" fill-opacity="0.09"/>

  <rect x="56" y="64" width="688" height="422" rx="26" fill="url(#panel)" stroke="#67e8f9" stroke-opacity="0.32" filter="url(#softShadow)"/>
  <rect x="56" y="64" width="688" height="8" rx="4" fill="url(#accent)"/>

  <!-- stylized docker whale + containers -->
  <g transform="translate(110 170)">
    <rect x="14" y="0" width="34" height="34" rx="5" fill="#38bdf8"/>
    <rect x="54" y="0" width="34" height="34" rx="5" fill="#38bdf8"/>
    <rect x="94" y="0" width="34" height="34" rx="5" fill="#38bdf8"/>
    <rect x="54" y="-40" width="34" height="34" rx="5" fill="#38bdf8"/>
    <path d="M0,62 C18,48 66,44 128,46 C160,47 190,56 206,70 C220,82 218,96 203,104 C192,110 173,114 150,116 C109,120 63,119 34,112 C14,107 1,98 0,88 Z" fill="#22d3ee"/>
    <circle cx="166" cy="82" r="3.3" fill="#0f172a"/>
  </g>

  <text x="318" y="215" fill="#e2f3ff" font-size="48" font-family="'Segoe UI', Arial, sans-serif" font-weight="700">Docker Commands</text>
  <text x="318" y="265" fill="#c0eaff" font-size="30" font-family="'Segoe UI', Arial, sans-serif" font-weight="600">Practical Cheat Sheet</text>
  <text x="318" y="315" fill="#8edbff" font-size="21" font-family="'Segoe UI', Arial, sans-serif">Image  Container  Network  Volume  Compose</text>

  <rect x="106" y="386" width="588" height="58" rx="12" fill="#0b1528" stroke="#38bdf8" stroke-opacity="0.35"/>
  <text x="126" y="423" fill="#7dd3fc" font-size="22" font-family="'Consolas', 'Courier New', monospace">docker pull   run   ps   logs   exec   compose up</text>
</svg>
