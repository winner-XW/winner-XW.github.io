  <rect x="72" y="430" rx="12" ry="12" width="460" height="108" fill="#0b1020" opacity="0.45" stroke="#93c5fd" stroke-opacity="0.35"/>
  <text x="100" y="485" font-size="42" fill="#f8fafc" font-family="Consolas, Menlo, monospace" letter-spacing="2">00:59:59</text>
  <text x="100" y="520" font-size="20" fill="#bfdbfe" font-family="Arial, sans-serif">Render by requestAnimationFrame</text>
