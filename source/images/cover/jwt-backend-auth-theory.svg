<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img" aria-labelledby="title desc">
  <title id="title">JWT Backend Auth Theory Cover</title>
  <desc id="desc">Backend JWT authentication theory including token lifecycle and security strategy</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="800" height="550" fill="url(#bg)"/>
  <circle cx="690" cy="85" r="110" fill="#a78bfa" opacity="0.16"/>
  <circle cx="120" cy="410" r="130" fill="#22d3ee" opacity="0.12"/>

  <rect x="42" y="36" width="226" height="36" rx="10" fill="url(#chip)"/>
  <text x="155" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#082f49">
    BACKEND THEORY
  </text>

  <text x="42" y="130" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#f8fafc">
    JWT Authentication
  </text>
  <text x="42" y="174" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#dbeafe">
    Structure, Lifecycle, Security
  </text>

  <rect x="42" y="224" width="716" height="162" rx="14" fill="#081225" opacity="0.6" stroke="#93c5fd" stroke-opacity="0.35"/>
  <text x="70" y="265" font-family="Consolas, Menlo, monospace" font-size="18" fill="#bfdbfe">
    header.payload.signature
  </text>
  <text x="70" y="296" font-family="Consolas, Menlo, monospace" font-size="18" fill="#bfdbfe">
    Access Token 15m | Refresh Token 14d
  </text>
  <text x="70" y="336" font-family="Arial, sans-serif" font-size="19" fill="#e2e8f0">
    ISS | AUD | EXP | JTI | Key Rotation
  </text>
</svg>
